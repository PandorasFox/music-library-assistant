[workspace]
members = [".", "crates/mm-utils", "crates/mm-derive"]

[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal crates
mm-utils = { path = "crates/mm-utils" }
mm-derive = { path = "crates/mm-derive" }

# Config parsing
kdl = "4.7.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Terminal image rendering
ratatui-image = { version = "4.2", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# Audio metadata
symphonia = { version = "0.5", features = ["all"] }
symphonia-core = "0.5"  # For custom codec registry
symphonia-adapter-libopus = "0.2"  # Opus decoder via libopus
lofty = "0.23.2"  # For reading/writing all tags

# Audio encoding
flac-codec = "1.3"     # Pure Rust FLAC encoder (zero C deps)
audiopus = "0.2"       # Opus encoding via libopus (pkg-config on Linux, cmake bundle on macOS)
ogg = "0.9"            # OGG container writing (pure Rust)
rubato = "0.14"        # Sample rate conversion for Opus (pure Rust)

# Acoustic fingerprinting
rusty-chromaprint = "0.1"

# File system utilities
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
walkdir = "2.5"
dirs = "5.0"
chrono = "0.4"
tempfile = "3.8"

# Parallel processing
rayon = "1.10"

# Memory allocator (jemalloc: better arena return behavior vs glibc malloc)
tikv-jemallocator = "0.6"

# Collections
indexmap = "2.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Duration parsing
humantime = "2"

# Regex
regex = "1.10"

# Signal handling
signal-hook = "0.3"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Random number generation
rand = "0.8"

# Password hashing (Argon2id)
argon2 = "0.5"

# Lock-free atomic Arc swapping (session table)
arc-swap = "1"

# HTTP client (blocking, minimal — for AcoustID API)
ureq = "2"
serde_json = "1"

# Base64 encoding (for chromaprint fingerprint compression)
base64 = "0.22"
unicode-width = "0.2"

# String similarity (for MusicBrainz release matching)
strsim = "0.11"

[[bin]]
name = "mm"
path = "src/main.rs"
