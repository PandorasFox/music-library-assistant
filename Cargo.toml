[workspace]
members = [".", "crates/mm-utils", "crates/mm-derive", "crates/mm-meta", "crates/mm-ui", "crates/mm-tui", "crates/mm-web", "crates/mm-web/client"]
default-members = [".", "crates/mm-tui"]

[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal crates
mm-utils = { path = "crates/mm-utils" }
mm-derive = { path = "crates/mm-derive" }
mm-meta = { path = "crates/mm-meta" }

# Config parsing
kdl = "4.7.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Image metadata (for corpus image indexing)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# Audio metadata
symphonia = { version = "0.5", features = ["all"] }
symphonia-core = "0.5"  # For custom codec registry
symphonia-adapter-libopus = "0.2"  # Opus decoder via libopus
lofty = "0.23.2"  # For reading/writing all tags

# Audio encoding
flac-codec = "1.3"     # Pure Rust FLAC encoder (zero C deps)
audiopus = "0.2"       # Opus encoding via libopus (test fixtures only)
ogg = "0.9"            # OGG container writing (test fixtures only)

# Acoustic fingerprinting
rusty-chromaprint = "0.1"

# File system utilities
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
walkdir = "2.5"
dirs = "5.0"
chrono = "0.4"
tempfile = "3.8"

# Parallel processing
rayon = "1.10"

# Memory allocator (jemalloc: better arena return behavior vs glibc malloc)
tikv-jemallocator = "0.6"

# Collections
indexmap = "2.6"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Duration parsing
humantime = "2"

# Regex
regex = "1.10"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Random number generation
rand = "0.8"

# Password hashing (Argon2id)
argon2 = "0.5"

# Lock-free atomic Arc swapping (session table)
arc-swap = "1"

# HTTP client (async + blocking)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

# Base64 encoding (for chromaprint fingerprint compression)
base64 = "0.22"
# String similarity (for MusicBrainz release matching)
strsim = "0.11"

[[bin]]
name = "mm"
path = "src/main.rs"
