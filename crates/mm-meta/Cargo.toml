[package]
name = "mm-meta"
version = "0.1.0"
edition = "2021"
description = "Shared protocol types and data structures for MM (Music Magic)"

[dependencies]
mm-utils = { path = "../mm-utils" }

serde = { version = "1.0", features = ["derive"] }
bincode = "1"
lofty = "0.23.2"
anyhow = "1.0"
chrono = "0.4"
strsim = "0.11"
indexmap = "2.6"
serde_json = "1"
tokio = { version = "1", features = ["sync", "io-util", "net"] }
