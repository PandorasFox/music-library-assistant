[package]
name = "mm-ui"
version = "0.1.0"
edition = "2021"
description = "Shared UI logic for MM backends (TUI, web)"

[dependencies]
chrono = "0.4"
humantime = "2"
mm-meta = { path = "../mm-meta", default-features = false }
ratatui = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
unicode-width = "0.2"
