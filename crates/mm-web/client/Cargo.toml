[package]
name = "mm-web-client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
mm-ui = { path = "../../mm-ui" }
mm-meta = { path = "../../mm-meta" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Node",
    "NodeList",
    "Storage",
    "Window",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "KeyboardEvent",
    "MouseEvent",
    "EventTarget",
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
