<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Magic</title>
    <link rel="stylesheet" href="/static/mm.css">
</head>
<body>
    <div id="mm-root"></div>
    <script>
        // List keyboard navigation — mirrors TUI arrow/enter/home/end/pgup/pgdn.
        window.__mm_list_nav = function(section, event) {
            var ul = section.querySelector('.mm-list__items');
            if (!ul) return;
            var items = ul.children;
            if (items.length === 0) return;

            var cursorIdx = -1;
            for (var i = 0; i < items.length; i++) {
                if (items[i].classList.contains('mm-list__item--cursor')) {
                    cursorIdx = i;
                    break;
                }
            }
            if (cursorIdx === -1) cursorIdx = 0;

            var newIdx = cursorIdx;
            switch (event.key) {
                case 'ArrowDown':
                    event.preventDefault();
                    newIdx = Math.min(cursorIdx + 1, items.length - 1);
                    break;
                case 'ArrowUp':
                    event.preventDefault();
                    newIdx = Math.max(cursorIdx - 1, 0);
                    break;
                case 'Home':
                    event.preventDefault();
                    newIdx = 0;
                    break;
                case 'End':
                    event.preventDefault();
                    newIdx = items.length - 1;
                    break;
                case 'PageDown':
                    event.preventDefault();
                    var pageH = items[0] ? items[0].offsetHeight : 24;
                    var page = Math.max(1, Math.floor(ul.clientHeight / pageH) - 1);
                    newIdx = Math.min(cursorIdx + page, items.length - 1);
                    break;
                case 'PageUp':
                    event.preventDefault();
                    var pageH2 = items[0] ? items[0].offsetHeight : 24;
                    var page2 = Math.max(1, Math.floor(ul.clientHeight / pageH2) - 1);
                    newIdx = Math.max(cursorIdx - page2, 0);
                    break;
                case 'Enter':
                    event.preventDefault();
                    var cur = items[cursorIdx];
                    var clickable = cur.querySelector('[onclick]');
                    if (clickable) clickable.click();
                    return;
                case ' ':
                    event.preventDefault();
                    items[cursorIdx].classList.toggle('mm-list__item--selected');
                    return;
                default:
                    return;
            }

            if (newIdx !== cursorIdx) {
                items[cursorIdx].classList.remove('mm-list__item--cursor');
                items[newIdx].classList.add('mm-list__item--cursor');
                items[newIdx].scrollIntoView({block: 'nearest'});
            }
        };

        // Wizard overlay: clicking 🪄 opens a centered overlay with detail content.
        window.__mm_wizard_dismiss = function() {
            var bd = document.getElementById('mm-wizard-backdrop');
            var ov = document.getElementById('mm-wizard-overlay');
            if (bd) bd.remove();
            if (ov) ov.remove();
            var prev = document.querySelector('.mm-wizard__toggle--active');
            if (prev) prev.classList.remove('mm-wizard__toggle--active');
        };
        window.__mm_wizard_toggle = function(el) {
            var wid = el.dataset.wizardId;
            var dataEl = document.getElementById('mm-wd-' + wid);
            if (!dataEl) return;
            // If already showing this one, dismiss.
            var existing = document.getElementById('mm-wizard-overlay');
            if (existing && existing.dataset.activeWand === wid) {
                window.__mm_wizard_dismiss();
                return;
            }
            // Dismiss any existing overlay first.
            window.__mm_wizard_dismiss();
            // Build backdrop (click to dismiss).
            var bd = document.createElement('div');
            bd.id = 'mm-wizard-backdrop';
            bd.className = 'mm-wizard-backdrop';
            bd.onclick = window.__mm_wizard_dismiss;
            document.body.appendChild(bd);
            // Build overlay.
            var ov = document.createElement('div');
            ov.id = 'mm-wizard-overlay';
            ov.className = 'mm-wizard-overlay';
            ov.dataset.activeWand = wid;
            var wtitle = el.dataset.wizardTitle || '';
            var titleHtml = wtitle ? '<h3 class="mm-wizard-overlay__title">' + wtitle.replace(/</g,'&lt;') + '</h3>' : '';
            ov.innerHTML = '<button class="mm-wizard-overlay__close" onclick="window.__mm_wizard_dismiss()">\u00d7</button>' + titleHtml + '<div class="mm-wizard-overlay__content">' + dataEl.innerHTML + '</div>';
            document.body.appendChild(ov);
            el.classList.add('mm-wizard__toggle--active');
            // Esc to dismiss.
            var escHandler = function(e) {
                if (e.key === 'Escape') {
                    window.__mm_wizard_dismiss();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);
        };

        // Click-to-cursor: move cursor highlight to the clicked list item.
        window.__mm_list_click = function(ul, event) {
            var item = event.target.closest('.mm-list__item');
            if (!item) return;
            var prev = ul.querySelector('.mm-list__item--cursor');
            if (prev) prev.classList.remove('mm-list__item--cursor');
            item.classList.add('mm-list__item--cursor');
        };
    </script>
    <script type="module">
        import init, {
            mm_login, mm_navigate, mm_logout,
            mm_tx_confirm, mm_tx_discard, mm_tx_remove,
            mm_expand_session, mm_packing_browse, mm_setup,
            mm_queue_task, mm_search, mm_expand_dir,
            mm_config_save, mm_stage_decision, mm_approve_releases,
            mm_index_now, mm_navigate_route, mm_deploy_tab,
            mm_tag_save, mm_tag_add, mm_tag_delete,
            mm_resolve_cancel, mm_resolve_action,
            mm_resolve_page, mm_resolve_confirm_with_field
        } from '/static/pkg/mm_web_client.js';
        await init();
        window.__mm_login = mm_login;
        window.__mm_navigate = mm_navigate;
        window.__mm_logout = mm_logout;
        window.__mm_tx_confirm = mm_tx_confirm;
        window.__mm_tx_discard = mm_tx_discard;
        window.__mm_tx_remove = mm_tx_remove;
        window.__mm_expand_session = mm_expand_session;
        window.__mm_packing_browse = mm_packing_browse;
        window.__mm_setup = mm_setup;
        window.__mm_queue_task = mm_queue_task;
        window.__mm_search = mm_search;
        window.__mm_expand_dir = mm_expand_dir;
        window.__mm_config_save = mm_config_save;
        window.__mm_stage_decision = mm_stage_decision;
        window.__mm_approve_releases = mm_approve_releases;
        window.__mm_index_now = mm_index_now;
        window.__mm_navigate_route = mm_navigate_route;
        window.__mm_deploy_tab = mm_deploy_tab;
        window.__mm_tag_save = mm_tag_save;
        window.__mm_tag_add = mm_tag_add;
        window.__mm_tag_delete = mm_tag_delete;
        window.__mm_resolve_cancel = mm_resolve_cancel;
        window.__mm_resolve_action = mm_resolve_action;
        window.__mm_resolve_page = mm_resolve_page;
        window.__mm_resolve_confirm_with_field = mm_resolve_confirm_with_field;
    </script>
</body>
</html>
